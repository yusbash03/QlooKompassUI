# Included in every location that sets its own headers (nginx drops inherited add_header otherwise).
# Frontend CSP (02-security §3): the API is same-origin; Google Fonts is the only third party.
# 'unsafe-inline' for styles covers React style attributes (e.g. affinity bar widths); scripts stay 'self' only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
